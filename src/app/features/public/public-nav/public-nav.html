<header class="sticky top-0 z-20 border-b border-ink-300/60 bg-surface">
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-3 px-4 sm:px-6">
    <a routerLink="/pub" class="flex min-h-11 items-center gap-2.5">
      <svg viewBox="0 0 40 40" class="h-8 w-8 shrink-0" aria-hidden="true" focusable="false">
        <rect x="0" y="0" width="18" height="18" rx="4" fill="var(--color-brand-500)" />
        <rect x="22" y="0" width="18" height="18" rx="4" fill="var(--color-sand-500)" />
        <rect x="0" y="22" width="18" height="18" rx="4" fill="var(--color-sand-500)" />
        <path d="M22 40 V31 A9 9 0 0 1 40 31 V40 Z" fill="var(--color-brand-500)" />
      </svg>
      <span class="text-base font-semibold text-ink-900 sm:text-lg">{{ 'brand.nameEn' | translate }}</span>
    </a>

    <div class="ms-auto flex items-center gap-1 sm:gap-2">
      <button
        type="button"
        class="inline-flex min-h-11 items-center gap-1.5 rounded-card px-2.5 text-sm font-medium text-ink-700 hover:bg-surface-container-low"
        [attr.aria-label]="'header.toggleLanguage' | translate"
        (click)="toggleLocale()"
      >
        <svg lucideGlobe [size]="18"></svg>
        <span>{{ i18n.locale() === 'ar' ? 'EN' : 'ع' }}</span>
      </button>

      <a
        routerLink="/pub/email-check/request"
        class="inline-flex min-h-11 items-center rounded-card bg-brand-500 px-4 text-sm font-medium text-white transition-colors hover:bg-brand-600"
      >
        {{ 'common.signIn' | translate }}
      </a>
    </div>
  </div>
</header>
