<div class="pb-10">
  <app-page-header [showBack]="true" [title]="'funding.signature.title' | translate" />

  <div class="py-4">
    <section class="rounded-card border border-ink-300 bg-surface p-4">
      <p class="text-sm text-ink-700">{{ 'funding.signature.instructions' | translate }}</p>

      <div class="mt-4">
        <app-signature-pad (signatureCaptured)="onCaptured($event)" />
      </div>

      <div class="mt-4 flex items-center gap-3">
        <button
          type="button"
          class="inline-flex min-h-11 items-center justify-center rounded-card border border-ink-300 bg-surface px-5 text-sm font-medium text-ink-700 hover:bg-surface-container-low disabled:opacity-60"
          [disabled]="submitting()"
          (click)="onCancel()"
        >
          {{ 'common.cancel' | translate }}
        </button>
        @if (submitting()) {
          <span class="text-sm text-ink-500">{{ 'common.loading' | translate }}</span>
        }
      </div>
    </section>
  </div>
</div>
