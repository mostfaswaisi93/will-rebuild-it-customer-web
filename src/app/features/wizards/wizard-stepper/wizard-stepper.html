<div class="mb-6">
  <div
    class="flex items-center gap-1.5"
    role="progressbar"
    [attr.aria-valuenow]="stepNumber()"
    aria-valuemin="1"
    [attr.aria-valuemax]="totalSteps()"
  >
    @for (index of segments(); track index) {
      <span
        class="h-1.5 flex-1 rounded-full transition-colors"
        [class]="index < stepNumber() ? 'bg-brand-500' : 'bg-ink-300'"
      ></span>
    }
  </div>

  <div class="mt-3 flex items-baseline justify-between gap-3">
    <h2 class="text-lg font-semibold text-ink-900">{{ title() }}</h2>
    <span class="shrink-0 text-sm text-ink-500">
      {{ 'wizards.common.stepOf' | translate: { current: stepNumber(), total: totalSteps() } }}
    </span>
  </div>
</div>
