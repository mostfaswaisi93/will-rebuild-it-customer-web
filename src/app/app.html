<!--
  Skip link: the first thing in the tab order, visually hidden until focused.
  Lets a keyboard user jump past the sidebar/header nav straight to the page
  content instead of tabbing through every nav item on every page.
-->
<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); focusMainContent()">
  {{ 'a11y.skipToContent' | translate }}
</a>
