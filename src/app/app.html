<!--
  Skip link: the first thing in the tab order, visually hidden until focused.
  Lets a keyboard user jump past the sidebar/header nav straight to the page
  content instead of tabbing through every nav item on every page.
-->
<a
  class="sr-only rounded-card bg-brand-500 px-4 py-2 text-sm font-medium text-white focus:not-sr-only focus:absolute focus:top-3 focus:inset-s-3 focus:z-50 focus:outline focus:outline-2 focus:outline-offset-2 focus:outline-brand-700"
  href="#main-content"
  (click)="$event.preventDefault(); focusMainContent()"
>
  {{ 'a11y.skipToContent' | translate }}
</a>

<router-outlet />
